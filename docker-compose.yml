version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: opsai_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: opsai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: opsai_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/opsai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=opsai_super_secret_jwt_key_2026_production_grade
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb
      - redis
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: opsai_worker
    environment:
      - NODE_ENV=production
      - WORKER_PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/opsai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: opsai_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - api
    restart: always

volumes:
  mongodb_data:
  redis_data:
